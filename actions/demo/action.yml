name: Record preview demo
description: Record the repo's tour on the preview, compare it with the previous commit and publish both to demos/pr-<n> (`preview demo`).
inputs:
  url:
    required: true
  dokploy-api-key:
    required: true
  tour:
    default: .preview/tour.json
  github-token:
    description: Token with contents:write, used to publish to the demos branch
    required: true
outputs:
  markdown:
    description: Path to a Markdown file describing the demos, for the PR comment
    value: ${{ steps.run.outputs.markdown }}
runs:
  using: composite
  steps:
    - name: Install recorder
      shell: bash
      working-directory: ${{ github.action_path }}/../../lib/demo
      run: |
        # GitHub-hosted (apt) runners get ffmpeg and Chromium's libraries installed here; self-hosted
        # runners on other distros must provide them (see the README).
        if command -v apt-get >/dev/null; then
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null; }
          deps=--with-deps
        else
          command -v ffmpeg >/dev/null || { echo "::error::ffmpeg is not installed on this runner"; exit 1; }
          deps=
        fi
        npm ci --no-audit --no-fund
        npx playwright install $deps chromium >/dev/null
    - id: run
      shell: bash
      env:
        DOKPLOY_API_KEY: ${{ inputs.dokploy-api-key }}
        PREVIEW_URL: ${{ inputs.url }}
        TOUR: ${{ inputs.tour }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BRANCH: ${{ github.event.pull_request.head.ref }}
        SHA: ${{ github.event.pull_request.head.sha }}
        REPO: ${{ github.repository }}
        GH_TOKEN: ${{ inputs.github-token }}
        WORK: ${{ runner.temp }}/preview-demo
        MARKDOWN: ${{ runner.temp }}/preview-demo.md
      run: |
        "$GITHUB_ACTION_PATH/../../bin/preview" demo
        echo "markdown=$MARKDOWN" >> "$GITHUB_OUTPUT"
