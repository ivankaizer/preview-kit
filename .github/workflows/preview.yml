# Reusable: deploy the PR's preview, record the demo and comment on the PR (one sticky comment, or one per deploy).
# Callers need `permissions: { contents: write, pull-requests: write }` and `secrets: inherit`.
name: Preview

on:
  workflow_call:
    inputs:
      runner:
        description: 'Where the job runs, as JSON: "ubuntu-latest" (default) or a self-hosted label list such as ["self-hosted","macserv"]'
        type: string
        default: '"ubuntu-latest"'
      config:
        type: string
        default: .preview/config.json
      tour:
        type: string
        default: .preview/tour.json
      demo:
        description: Record a demo when the tour file exists
        type: boolean
        default: true
      comment:
        description: "`sticky` edits one PR comment on every deploy; `new` posts a fresh comment per deploy"
        type: string
        default: sticky
      hide-previous:
        description: "With `comment: new`, collapse earlier preview comments as outdated"
        type: boolean
        default: false
    secrets:
      DOKPLOY_API_KEY:
        required: true

jobs:
  preview:
    name: Deploy preview
    runs-on: ${{ fromJSON(inputs.runner) }}
    concurrency:
      group: preview-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - id: deploy
        uses: ivankaizer/preview-kit/actions/deploy@v1
        with:
          dokploy-api-key: ${{ secrets.DOKPLOY_API_KEY }}
          config: ${{ inputs.config }}

      - id: demo
        if: inputs.demo && hashFiles(inputs.tour) != '' && steps.deploy.outputs.url != ''
        continue-on-error: true
        uses: ivankaizer/preview-kit/actions/demo@v1
        with:
          url: ${{ steps.deploy.outputs.url }}
          dokploy-api-key: ${{ secrets.DOKPLOY_API_KEY }}
          tour: ${{ inputs.tour }}
          github-token: ${{ github.token }}

      - name: Comment on PR
        if: always() && steps.deploy.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          URL: ${{ steps.deploy.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
          DEMO_MD: ${{ steps.demo.outputs.markdown }}
          DEMO_OUTCOME: ${{ steps.demo.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMENT_MODE: ${{ inputs.comment }}
          HIDE_PREVIOUS: ${{ inputs.hide-previous }}
        run: |
          case "$COMMENT_MODE" in sticky|new) ;; *) echo "::error::comment must be sticky or new, got '$COMMENT_MODE'"; exit 1 ;; esac
          {
            echo '<!-- preview-kit -->'
            echo "🚀 **Preview:** $URL"
            echo
            echo "<sub>Deployed \`${SHA:0:7}\` · [run]($RUN_URL)</sub>"
            echo
            if [ -n "$DEMO_MD" ] && [ -f "$DEMO_MD" ]; then cat "$DEMO_MD"
            elif [ "$DEMO_OUTCOME" = failure ]; then echo "> ⚠️ Demo recording failed; see the [run]($RUN_URL)."
            fi
          } > body.md
          # Earlier preview comments, oldest first ("preview-url" is the pre-v1 marker).
          previous=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- preview-kit -->") or startswith("<!-- preview-url -->")) | "\(.id) \(.node_id)"')
          if [ "$COMMENT_MODE" = new ] || [ -z "$previous" ]; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file body.md
            if [ "$COMMENT_MODE" = new ] && [ "$HIDE_PREVIOUS" = true ] && [ -n "$previous" ]; then
              while read -r _ node_id; do
                gh api graphql -f id="$node_id" \
                  -f query='mutation($id: ID!) { minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) { clientMutationId } }' \
                  >/dev/null || echo "::warning::Could not hide previous preview comment $node_id"
              done <<< "$previous"
            fi
          else
            id=$(head -n1 <<< "$previous" | cut -d' ' -f1)
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@body.md >/dev/null
          fi
